[project]
name = "kiddo"
version = "0.1.0"
description = "Storybook-to-YouTube read-aloud video pipeline"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
    "reportlab>=4",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "mlx-audio==0.6.4",
    "soundfile>=0.12",
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.33",
    "coremltools>=8.3,<9",
    "onnxruntime>=1.31,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "codex: runs the real Codex (ChatGPT) provider; needs the ChatGPT app logged in",
    "tts: runs the real local voice model (slow; model must be downloaded)",
    "ffmpeg: runs the real ffmpeg binary",
    "models: runs the real segmentation/fill models (must be downloaded)",
]
addopts = "-m 'not codex and not tts and not ffmpeg and not models'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]  # the formatter wraps code; long test messages and comments stay readable
