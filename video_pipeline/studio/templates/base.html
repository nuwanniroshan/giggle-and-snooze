<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Giggle &amp; Snooze studio: turn each picture book into a storytime video, from script to voices to the final render.">
<title>{% block title %}Studio{% endblock %} · Giggle &amp; Snooze</title>
<link rel="icon" type="image/png" href="{{ static_url('logo.png') }}">
<link rel="stylesheet" href="{{ static_url('tokens.css') }}">
<link rel="stylesheet" href="{{ static_url('base.css') }}">
<link rel="stylesheet" href="{{ static_url('studio.css') }}">
{% block head %}{% endblock %}
</head>
<body data-running-job="{{ running.id if running else '' }}">
<header class="topbar">
  <div class="container bar">
    <a class="brand" href="/">
      <img class="brand-logo" src="{{ static_url('logo.png') }}" alt="Giggle &amp; Snooze" width="288" height="168">
    </a>
    <nav class="topnav" aria-label="Studio">
      <a href="/"{% if nav == 'books' %} aria-current="page"{% endif %}>Books</a>
      <a href="/youtube"{% if nav == 'youtube' %} aria-current="page"{% endif %}>YouTube</a>
      <a href="/books/new" class="cta">+ Add book</a>
    </nav>
  </div>
</header>
{% block main %}
<div class="container">{% include "_running.html" %}</div>
<main class="container page">
{% block content %}{% endblock %}
</main>
{% endblock %}
<script src="{{ static_url('studio.js') }}"></script>
</body>
</html>
