{% macro badge(state) -%}
<span class="state{% if state in ('failed', 'interrupted') %} strong{% endif %}">{{ state_word(state) }}</span>
{%- endmacro %}
{% macro problem_list(items, id=None) -%}
{% if items %}<ul class="problems"{% if id %} id="problems-{{ id }}"{% endif %}>{% for p in items %}<li>{{ p }}</li>{% endfor %}</ul>{% endif %}
{%- endmacro %}
{% macro book_links(book) -%}
<nav class="sub"><a href="/books/{{ book.slug }}">Stages</a> <a href="/books/{{ book.slug }}/script">Script</a> <a href="/books/{{ book.slug }}/audio">Audio</a> <a href="/books/{{ book.slug }}/video">Video</a></nav>
{%- endmacro %}
