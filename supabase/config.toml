# Minimal local Supabase config. Run `supabase init` to expand it if needed.
project_id = "giggle-and-snooze"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://giggleandsnooze.com", "https://read.giggleandsnooze.com"]

# Google sign-in. Disabled by default: set enabled = true and export
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (Google Cloud OAuth web client) before `supabase start`.
# Authorized redirect URI in Google: <supabase url>/auth/v1/callback
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
